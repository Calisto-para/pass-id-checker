services:
  - type: web
    name: pass-id-checker
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pass-id-checker-db
          property: connectionString

databases:
  - name: pass-id-checker-db
    plan: free
